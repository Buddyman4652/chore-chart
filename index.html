<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chores">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2467E0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chore Chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Gabarito:wght@500;700;800&display=swap">
<style>
/* Layout: graph-paper ground with color washes in each corner, solid-color kid headers, icon tiles on every chore, bright green when done; money and goals use tall bars like a savings jar chart. */
:root{
  --bg:#EEF3F8; --grid:rgba(36,103,224,.07); --card:#FFFFFF; --card2:#F3F7FB; --ink:#16202C; --muted:#586878; --line:#D3DDE7;
  --blob-a:rgba(36,103,224,.13); --blob-c:rgba(226,98,30,.13);
  --blue1:#2467E0; --blue1-tint:#DDE9FD; --blue1-ink:#FFFFFF;
  --warm1:#C94A10; --warm1-tint:#FFE4D4; --warm1-ink:#FFFFFF;
  --grape:#7B4FD6; --grape-ink:#FFFFFF; --teal:#0B7F8C; --teal-ink:#FFFFFF;
  --gold:#F2B01E; --on-gold:#3A2800; --gold-tint:#FFF0C7;
  --done:#17824A; --on-done:#FFFFFF; --bad:#B42318; --bad-tint:#FDE7E4;
  --t1:#FFDDE5; --t2:#D3F2EA; --t3:#FFEDB8; --t4:#DCE5FF; --t5:#FFE1CB; --t6:#E8DBFB;
  --g1:#00A9C2; --g2:#1AA7FF; --g3:#FFC266; --g4:#FF6B5B; --g5:#35D39B; --g-ink:#10202C;
  --scrim:rgba(14,22,32,.58); --shadow:0 1px 0 rgba(22,32,44,.04),0 10px 28px rgba(22,32,44,.10);
  --f-display:'Gabarito',ui-rounded,'SF Pro Rounded',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1620; --grid:rgba(140,170,255,.06); --card:#18222F; --card2:#1F2B3A; --ink:#EAF0F7; --muted:#9DB0C3; --line:#2D3B4C;
  --blob-a:rgba(110,162,255,.14); --blob-c:rgba(255,147,97,.12);
  --blue1:#6EA2FF; --blue1-tint:#1B2D52; --blue1-ink:#08162E;
  --warm1:#FF9361; --warm1-tint:#412516; --warm1-ink:#2B1000;
  --grape:#B79CFF; --grape-ink:#1E0F45; --teal:#4FD1DE; --teal-ink:#04282C;
  --gold:#FFC63D; --on-gold:#2E2000; --gold-tint:#3F3110;
  --done:#1B7F4B; --on-done:#FFFFFF; --bad:#FF8A7A; --bad-tint:#3E1B17;
  --t1:#4A2530; --t2:#1F4A42; --t3:#4D3F14; --t4:#26325E; --t5:#523320; --t6:#3B2B5E;
  --scrim:rgba(0,0,0,.66); --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1620; --grid:rgba(140,170,255,.06); --card:#18222F; --card2:#1F2B3A; --ink:#EAF0F7; --muted:#9DB0C3; --line:#2D3B4C;
  --blob-a:rgba(110,162,255,.14); --blob-c:rgba(255,147,97,.12);
  --blue1:#6EA2FF; --blue1-tint:#1B2D52; --blue1-ink:#08162E;
  --warm1:#FF9361; --warm1-tint:#412516; --warm1-ink:#2B1000;
  --grape:#B79CFF; --grape-ink:#1E0F45; --teal:#4FD1DE; --teal-ink:#04282C;
  --gold:#FFC63D; --on-gold:#2E2000; --gold-tint:#3F3110;
  --done:#1B7F4B; --on-done:#FFFFFF; --bad:#FF8A7A; --bad-tint:#3E1B17;
  --t1:#4A2530; --t2:#1F4A42; --t3:#4D3F14; --t4:#26325E; --t5:#523320; --t6:#3B2B5E;
  --scrim:rgba(0,0,0,.66); --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;color:var(--ink);font:500 18px/1.4 var(--f-body);min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 380px at 0% 0%,var(--blob-a),transparent 70%),radial-gradient(520px 380px at 100% 100%,var(--blob-c),transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{cursor:default;opacity:.55}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
.muted{color:var(--muted)}


.wrap{max-width:1180px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.date{font:700 14px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(28px,4.4vw,44px)/1.05 var(--f-display);letter-spacing:-.01em;text-wrap:balance;margin-top:2px}
.tools{display:flex;gap:10px;align-items:center}
.icon-btn{position:relative;width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center}
.dotbadge{position:absolute;top:-8px;right:-8px;min-width:24px;height:24px;border-radius:12px;background:var(--warm1);color:var(--warm1-ink);font:800 13px/24px var(--f-body);text-align:center;padding:0 6px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 16px var(--f-body)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.light{background:#fff;border-color:#fff;color:#0E5A32}

.seg{display:inline-grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:18px}
.seg button{min-height:46px;padding:0 22px;border:0;border-radius:12px;background:transparent;font:800 16px var(--f-display)}
.seg button[aria-selected="true"]{background:var(--grape);color:var(--grape-ink)}

.note{margin-bottom:16px;padding:12px 16px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:600}
.note.bad{background:var(--bad-tint);border-color:var(--bad)}
.cheer{margin-bottom:16px;padding:14px 18px;border-radius:16px;background:var(--gold);color:var(--on-gold);font:800 20px var(--f-display);text-align:center}

.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:22px;align-items:start}
.card{background:var(--card);border-radius:26px;box-shadow:var(--shadow);overflow:hidden;border:2px solid var(--line)}
.card.alldone{border-color:var(--gold)}
.who{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 20px;border:0;color:var(--ki);background:radial-gradient(circle at 92% 8%,rgba(255,255,255,.24) 0 56px,transparent 57px),radial-gradient(circle at 68% 130%,rgba(255,255,255,.16) 0 84px,transparent 85px),var(--k)}
.card.alldone .who{--k:var(--gold);--ki:var(--on-gold)}
.avatar{display:block;width:76px;height:76px;border-radius:50%;overflow:hidden;border:4px solid var(--ki);background:var(--kt);flex:none}
.avatar img{display:block;width:100%;height:100%;object-fit:cover}
.avatar.sm{width:34px;height:34px;border-width:3px;border-color:var(--k)}
.avatar.lg{width:84px;height:84px;border-color:var(--k)}
.avatar.big{width:124px;height:124px;border-width:6px;border-color:var(--k);margin:0 auto}
.name{display:block;font:800 30px/1.05 var(--f-display)}
.sub{display:block;font:700 14px var(--f-body);margin-top:5px;opacity:.94}
.wchips{display:grid;gap:6px;justify-items:end}
.pts{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--gold);color:var(--on-gold);border-radius:18px;padding:8px 14px;min-width:84px}
.card.alldone .pts{background:var(--card);color:var(--ink)}
.pnum{display:flex;align-items:center;gap:4px}
.pts b{font:800 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pts small{font:700 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.star{width:20px;height:20px;fill:var(--on-gold);stroke:none}
.card.alldone .pts .star{fill:var(--gold)}
.cash{background:var(--done);color:var(--on-done);border-radius:999px;padding:3px 12px;font:800 15px var(--f-display);font-variant-numeric:tabular-nums}
.bday{margin:14px 16px 0;padding:10px 14px;border-radius:14px;background:var(--gold-tint);font:700 17px var(--f-body)}

.prog{padding:16px 20px 4px}
.ptext{display:flex;justify-content:space-between;align-items:center;gap:10px;font:700 16px var(--f-body);margin-bottom:10px}
.ptext b{font:800 28px/1 var(--f-display)}
.tagdone{display:inline-flex;align-items:center;background:var(--done);color:var(--on-done);border-radius:999px;padding:3px 12px;font:800 14px var(--f-body)}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:16px;border-radius:8px;background:var(--line);transition:background .25s}
.segs i.on{background:var(--done)}

.chores{padding:14px 16px 18px;display:grid;gap:10px}
.chore{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;width:100%;min-height:80px;padding:10px 16px 10px 10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;transition:background .15s,border-color .15s,transform .1s}
.chore:active{transform:scale(.985)}
.tile{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:32px;line-height:1;flex:none;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.t0{background:var(--t1)}.t1{background:var(--t2)}.t2{background:var(--t3)}.t3{background:var(--t4)}.t4{background:var(--t5)}.t5{background:var(--t6)}
.ctext{display:grid;min-width:0}
.cname{font:700 21px/1.2 var(--f-body);overflow-wrap:anywhere}
.csub{font:700 14px var(--f-body);color:var(--muted)}
.box{width:46px;height:46px;border-radius:50%;border:3px solid var(--muted);display:grid;place-items:center;background:var(--card);transition:background .15s,border-color .15s}
.box svg{width:28px;height:28px;fill:none;stroke:var(--done);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:28;stroke-dashoffset:28;transition:stroke-dashoffset .25s}
.chore.done{background:var(--done);border-color:var(--done);color:var(--on-done)}
.chore.done .csub{color:var(--on-done);opacity:.95}
.chore.done .cname{text-decoration:line-through;text-decoration-thickness:2px}
.chore.done .tile{opacity:.92}
.chore.done .box{background:#fff;border-color:#fff}
.chore.done .box svg{stroke-dashoffset:0}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(23,130,74,.6)}100%{box-shadow:0 0 0 18px rgba(23,130,74,0)}}
.chore.just{animation:flash .6s ease-out}
.chore.just .box{animation:pop .35s ease}
.xtra{padding:0 16px 18px;display:grid;gap:10px;margin-top:-2px}
.xhead{display:grid;gap:2px;padding-top:6px;border-top:2px dashed var(--line)}
.xhead b{font:800 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase;padding-top:10px}
.xhead span{font:600 14px var(--f-body);color:var(--muted)}
.streak{margin:12px 20px 0;display:grid;gap:6px}
.shead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 15px var(--f-body)}
.shead b{font:800 20px var(--f-display);font-variant-numeric:tabular-nums}
.smuted{color:var(--muted);font:600 13px var(--f-body)}
.sbarw{position:relative;margin-bottom:32px}
.sbarw .mark{position:absolute;top:9px;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card);border:3px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.sbarw .mark>span{font-size:20px;line-height:1}
.sbarw .mark:not(.got):not(.open)>span{opacity:.5}
.sbarw .mark.got{display:grid;justify-content:normal;gap:0;padding:0;border-width:3px;border-color:#F2B01E;background:#FFF0C7;animation:mpulse 1.4s infinite}
.sbarw .mark.open{border-color:var(--done);background:#D3F2EA}
.sbarw .mark small{position:absolute;top:38px;left:50%;transform:translateX(-50%);font:700 11px var(--f-body);color:var(--muted);white-space:nowrap}
@keyframes mpulse{50%{transform:translate(-50%,-50%) scale(1.12)}}
.wk-gain{display:grid;gap:6px;margin:10px 0 4px;padding:10px 12px;border-radius:14px;background:var(--card2,#f1f5fb);font-size:14px}
.wk-gain ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.wk-gain li{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:4px 10px 4px 4px;border-radius:12px;background:#fff}
.wk-gain li img{border-radius:8px}
.gstrip{margin:4px 0 14px}
.gmlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.gm{display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:14px;background:var(--card2,#f1f5fb);min-width:0}
.gm img{border-radius:12px;filter:grayscale(1);opacity:.45}
.gm b{font-size:14px;line-height:1.2;color:var(--muted)}
.gm span{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.gm.on img{filter:none;opacity:1}
.gm.on b{color:var(--ink)}
.gm.on span{color:#17824a}
.gfold{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 4px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left}
.gcaret{font-size:22px;width:24px}.gtitle{font:800 22px var(--f-display)}.gnote{margin-left:auto;color:var(--muted);font:600 14px var(--f-body)}
.gbody{display:grid;gap:12px;margin-top:8px}.goff{opacity:.55}
.pbtn{display:flex;gap:10px;align-items:center;margin:2px 0 6px;padding:10px 14px;border-radius:16px;background:linear-gradient(90deg,#FFF0C7,#FFE1CB);border:2px solid #F2B01E;font:800 17px var(--f-display);width:100%;color:#1b2430;cursor:pointer}
.pbtn span{font:600 13px var(--f-body);color:#5b6572;display:block}
.pbtn>span{font-size:26px;display:inline}
.tag1{font:800 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:#E8DBFB;color:#3B1E7A;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.chore.oneoff{border-style:dashed;border-color:#7B4FD6}
.boxshake{animation:bshake .3s infinite}
@keyframes bshake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.08)}}
.tier{display:flex;align-items:center;gap:10px}
.medal{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--card2)}
.pill{display:inline-flex;align-items:center;gap:6px;font:700 14px var(--f-body);padding:6px 8px 6px 12px;border-radius:999px;background:var(--card2);border:2px solid var(--line);margin:3px 4px 3px 0}
.pillx{border:0;background:transparent;font:800 18px/1 var(--f-body);color:var(--muted);cursor:pointer;padding:2px 6px}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.sbar{height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;min-width:0;border-radius:9px;background:linear-gradient(90deg,#F2B01E,#FF8A1F);transition:width .5s}
.cel-card.big{padding:34px 38px}.cel-card.big h2{font-size:52px}.cel-card .trophy{font-size:84px;line-height:1}.cel-card.big .bonus{font-size:34px}
.xnone{font:600 14px var(--f-body);color:var(--muted);padding:2px 4px}
.xsel{width:100%;min-height:56px;padding:0 14px;border-radius:16px;border:2px dashed var(--line);background:var(--card);color:var(--ink);font:700 18px var(--f-body)}
.chore.xc{border-style:dashed}
.xrm{justify-self:start;border:0;background:transparent;color:var(--muted);font:700 13px var(--f-body);text-decoration:underline;padding:0 6px 4px;cursor:pointer;text-align:left}
.chore.xc.done{border-style:solid}
.empty{padding:14px 4px;color:var(--muted);font-weight:600}
.skel{height:80px;border-radius:20px;background:var(--card2)}
.floatpts{position:fixed;z-index:95;pointer-events:none;font:800 26px var(--f-display);background:var(--gold);color:var(--on-gold);padding:2px 14px;border-radius:999px;transform:translate(-50%,-50%);animation:floatup .95s ease-out forwards}
@keyframes floatup{from{opacity:1;transform:translate(-50%,-50%)}to{opacity:0;transform:translate(-50%,-200%)}}

/* week view */
.wk-sum{padding:16px 20px 4px;display:grid;gap:10px}
.wk-big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wk-big b{font:800 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.wk-big span{font-weight:700;color:var(--muted)}
.bar{height:16px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);border-radius:8px;transition:width .3s}
.mini{display:flex;gap:6px 18px;flex-wrap:wrap;font:600 15px var(--f-body);color:var(--muted)}
.mini b{color:var(--ink);font-variant-numeric:tabular-nums}
.wk-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 16px 4px;text-align:center}
.day{display:grid;justify-items:center;gap:4px;font:700 12px var(--f-body);color:var(--muted)}
.day small{font:600 11px var(--f-body);min-height:1.3em}
.day.today{color:var(--ink)}
.ring{--p:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--done) calc(var(--p) * 1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.ring.full{background:var(--done)}
.ring.full::after{background:var(--done)}
.ring.none{background:var(--line)}
.ring svg{position:relative;z-index:1;width:20px;height:20px;fill:none;stroke:var(--on-done);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.tl-wrap{padding:14px 16px 20px}
h3.sec{font:800 20px var(--f-display);margin-bottom:10px}
.tl{display:grid;grid-template-columns:repeat(5,1fr)}
.tlc{position:relative;display:grid;grid-template-rows:20px 30px auto;justify-items:center;gap:8px;text-align:center}
.tlc::before{content:"";position:absolute;left:0;right:0;top:43px;height:2px;background:var(--line)}
.tlc:first-child::before{left:50%}
.tlc:last-child::before{right:50%}
.tl-lab{font:700 13px var(--f-body);color:var(--muted)}
.tl-pct{font:800 14px var(--f-body);font-variant-numeric:tabular-nums}
.tl-node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--muted)}
.tl-node svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.tl-node.ok{background:var(--done);border-color:var(--done);color:var(--on-done)}
.tl-node.miss{border-color:var(--muted)}
.tl-node.cur{border-color:var(--grape);border-width:3px}
.tl-note{font-size:13px;margin-top:10px}
.fam{margin-bottom:18px;padding:16px 20px;border-radius:22px;background:var(--grape);color:var(--grape-ink);display:grid;gap:10px}
.fam b{font:800 28px var(--f-display)}
.fam .bar{background:rgba(255,255,255,.3)}
.fam .bar i{background:#fff}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;display:flex;background:var(--scrim);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 14px) max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px))}
#parent{z-index:60;background:var(--bg)}
#editor{z-index:70}
#chat{z-index:75}
#pin{z-index:80}
#celebrate{z-index:90}
.panel{margin:auto;width:100%;max-width:580px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px;display:grid;gap:18px}
.sh-head{display:flex;align-items:center;gap:16px}
.sh-head h2{font:800 32px/1 var(--f-display)}
.closebar{display:flex;justify-content:flex-end}
.chipsrow{display:flex;gap:10px;flex-wrap:wrap}
.bigchip{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:18px;font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bigchip small{font:700 13px var(--f-body);letter-spacing:.05em;text-transform:uppercase}
.bigchip.gold{background:var(--gold);color:var(--on-gold)}
.bigchip.green{background:var(--done);color:var(--on-done)}
.bigchip.sv{background:var(--card2,#F3F7FB);color:var(--ink);border:2px solid var(--line,#D3DDE7);padding:6px 14px;font-size:22px}
.txbtn{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:48px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink);font:800 17px var(--f-body);cursor:pointer}
.txbtn small{font:700 13px var(--f-body);color:var(--muted)}
.stabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:var(--card2);padding:6px;border-radius:16px;border:2px solid var(--line)}
.stab{min-height:46px;border:0;border-radius:11px;background:transparent;font:800 16px var(--f-display)}
.stab[aria-selected="true"]{background:var(--k);color:var(--ki)}
.stack{display:grid;gap:18px}
.rws{display:grid;gap:10px}
.rw{display:grid;gap:10px;padding:14px 16px;border:2px solid var(--line);border-radius:18px;background:var(--card2)}
.rw-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rw-title{display:flex;align-items:center;gap:12px;min-width:0}
.rw-name{font:700 19px/1.2 var(--f-body);overflow-wrap:anywhere}
.cost{display:inline-flex;align-items:center;gap:4px;font:800 18px var(--f-display);background:var(--gold);color:var(--on-gold);border-radius:999px;padding:2px 12px;white-space:nowrap}
.cost .star{width:16px;height:16px}
.meter{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--k);border-radius:6px}
.rw-foot,.rw-conf{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-weight:600}
.rw-btns{display:flex;gap:8px;flex-wrap:wrap}
.got{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 4px;border-bottom:2px solid var(--line)}
.got:last-child{border-bottom:0}
.got>div{display:grid;min-width:0}
.got b{font-weight:700;overflow-wrap:anywhere}
.got .muted{font-size:14px}
.tag{padding:3px 12px;border-radius:999px;font:700 13px var(--f-body);white-space:nowrap}
.tag.ok{background:var(--done);color:var(--on-done)}
.tag.wait{background:var(--gold-tint);color:var(--ink)}
.tag.no{background:var(--card2);color:var(--muted)}
.todaybar{display:grid;gap:8px;padding:0 20px}
.wk-panel{background:var(--card2);border:2px solid var(--line);border-radius:22px;padding:16px 0 2px;overflow:hidden}
.todaybar .row-line b{font:800 20px var(--f-display)}

/* money + goals */
.bankcard{background:var(--done);color:var(--on-done);border-radius:22px;padding:18px 20px;display:grid;gap:10px;justify-items:start;background-image:radial-gradient(circle at 95% 10%,rgba(255,255,255,.2) 0 60px,transparent 61px)}
.bankcard .lab{color:var(--on-done);opacity:.9;margin:0}
.bank-amt{font:800 52px/1 var(--f-display);font-variant-numeric:tabular-nums}
.bankcard p{font-weight:600;opacity:.95}
.stack>*{min-width:0}
.goals{max-width:100%;display:flex;align-items:center;gap:12px;overflow-x:auto;padding:4px 2px 8px}
.gcols{display:flex;gap:12px}
.gcol{position:relative;flex:none;width:84px;height:320px;border-radius:14px;border:0;background:var(--card);box-shadow:0 0 0 2px var(--line) inset;overflow:hidden;text-align:center;padding:0}
.gname{position:absolute;top:12px;left:0;right:0;margin:auto;writing-mode:vertical-rl;max-height:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:800 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.gtag{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:800 11px var(--f-body);background:var(--gold);color:var(--on-gold);border-radius:999px;padding:2px 8px;white-space:nowrap}
.gtag.go{background:var(--done);color:var(--on-done)}
.gname.tagged{top:34px;max-height:128px}
.gfill{position:absolute;left:0;right:0;bottom:0;display:grid;align-content:end;justify-items:center;gap:0;padding-bottom:10px;color:var(--g-ink);border-radius:10px 10px 0 0;min-height:64px}
.gfill b{font:800 18px var(--f-display);font-variant-numeric:tabular-nums}
.gfill small{font:700 11px var(--f-body)}
.gadd{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--g1);color:var(--g-ink);font:800 30px/1 var(--f-display);display:grid;place-items:center}
.gtotal{text-align:center;display:grid;gap:2px;margin-top:6px}
.gtotal b{font:800 40px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.gtotal span{font:700 13px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:48px;height:48px;border-radius:50%;border:3px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}

.cel-card{margin:auto;position:relative;z-index:1;background:var(--card);border-radius:30px;padding:28px 30px;text-align:center;display:grid;gap:12px;justify-items:center;max-width:440px;width:100%;box-shadow:var(--shadow);animation:rise .5s cubic-bezier(.2,1.3,.4,1)}

.bonus{font:800 26px var(--f-display);background:var(--gold);color:var(--on-gold);border-radius:999px;padding:6px 20px}
@keyframes rise{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
#confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* parent portal */
.ppanel{margin:0 auto;width:100%;max-width:780px;display:grid;gap:16px;align-content:start}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--card2);padding:6px;border-radius:16px;border:2px solid var(--line)}
.tab{min-height:46px;padding:0 4px;white-space:nowrap;border:0;border-radius:11px;background:transparent;font:700 clamp(11px,2.5vw,15px) var(--f-body);display:flex;align-items:center;justify-content:center;gap:6px}

@media (max-width:560px){.tfull{display:none}.tshort{display:inline}}

.pbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}

.plist{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:12px;align-items:center;width:100%;text-align:left;padding:10px 14px 10px 10px;min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card2)}
.prow .tile{width:44px;height:44px;font-size:24px;border-radius:14px;grid-row:1 / span 2}
.pname{font:700 18px/1.2 var(--f-body);overflow-wrap:anywhere;grid-column:2}
.pmeta{grid-column:2;font:600 14px var(--f-body);color:var(--muted)}
.ppts{grid-column:3;grid-row:1 / span 2;font:800 18px var(--f-display);background:var(--gold);color:var(--on-gold);border-radius:999px;padding:2px 12px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}

.req{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;background:var(--card2);border:2px solid var(--line)}

input[type=text],input[type=password]{width:100%;font:600 18px var(--f-body);padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 16px var(--f-body)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}

.step{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--card);font:800 26px/1 var(--f-display);display:grid;place-items:center}

.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
.ib{height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card2);font-size:26px;line-height:1;display:grid;place-items:center;font-family:system-ui,"Apple Color Emoji","Segoe UI Emoji",sans-serif}
.ib[aria-pressed="true"]{border-color:var(--ink);background:var(--gold-tint)}
.epanel{margin:auto;width:100%;max-width:520px;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:22px;display:grid;gap:12px}
.epanel h2{font:800 26px var(--f-display)}
.epanel p.hint{max-width:none}
.eact{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}

/* chat */
.chatpanel{max-width:560px;height:min(760px,100%);grid-template-rows:auto minmax(0,1fr) auto;gap:12px}

/* pin pad */
.pin-panel{margin:auto;width:100%;max-width:360px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:24px 22px;text-align:center;display:grid;gap:8px}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--card);padding:12px 20px;border-radius:999px;font:700 16px var(--f-body);max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}

.cp{background:var(--card2);border:2px solid var(--line);border-radius:20px;padding:12px 16px;display:grid;gap:10px}

<script>
/* On-device backend for the chore chart. Gives the page the same small database API it used on Claude. */
(function(){
'use strict';
var cache={};
var docSubs={};
var META={fromCache:false,hasPendingWrites:false};
function C(c){return cache[c]||(cache[c]={map:new Map(),loaded:false,loading:null,subs:new Set()});}
function rid(){
  try{return Array.from(crypto.getRandomValues(new Uint8Array(10)),function(b){return b.toString(16).padStart(2,'0');}).join('');}
  catch(e){return Math.random().toString(16).slice(2,12)+Date.now().toString(16);}
}

var STORE={},LS_KEY='cc_store_v1',idb=null,persistT=0;
var COLNAMES=['chores','rewards','days','redemptions','adjustments','money','goals','ideas','messages','profiles','config'];
var BADK={'__proto__':1,'constructor':1,'prototype':1};
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function clean(v){
  if(Array.isArray(v))return v.map(clean);
  if(isObj(v)){var o={};Object.keys(v).forEach(function(k){if(!BADK[k])o[k]=clean(v[k]);});return o;}
  return v;
}
function deepMerge(a,b){
  var o=Object.assign({},a);
  Object.keys(b).forEach(function(k){
    if(BADK[k])return;
    var v=b[k];
    if(isObj(v)&&isObj(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v;
  });
  return o;
}
function pub(col,data){
  if(col==='config'&&data){var o=Object.assign({},data);o.hasPin=!!o.pinHash;o.hasRecovery=!!o.recHash;delete o.pinHash;delete o.recHash;return o;}
  return data;
}
function fail(code,msg){var e=new Error(msg||code);e.code=code;return e;}
function idbOpen(){
  return new Promise(function(res){
    try{
      var r=indexedDB.open('chorechart',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){res(null);};
      r.onblocked=function(){res(null);};
    }catch(e){res(null);}
  });
}
function idbGet(){
  return new Promise(function(res){
    try{var q=idb.transaction('kv','readonly').objectStore('kv').get('store');q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}
    catch(e){res(null);}
  });
}
function idbPut(obj){
  return new Promise(function(res,rej){
    try{var t=idb.transaction('kv','readwrite');t.objectStore('kv').put(obj,'store');t.oncomplete=function(){res();};t.onerror=function(){rej(t.error);};t.onabort=function(){rej(t.error);};}
    catch(e){rej(e);}
  });
}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(STORE));return true;}catch(e){return false;}}
var READY=(async function(){
  idb=await idbOpen();
  var st=null;
  if(idb)st=await idbGet();
  if(!st){try{var t=localStorage.getItem(LS_KEY);if(t)st=JSON.parse(t);}catch(e){}}
  STORE=isObj(st)?st:{};
  COLNAMES.forEach(function(c){if(!isObj(STORE[c]))STORE[c]={};});
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
})();
function flush(){
  persistT=0;
  if(idb){idbPut(STORE).catch(function(){if(!lsSave())window.dispatchEvent(new Event('cc-save-failed'));});}
  else if(!lsSave())window.dispatchEvent(new Event('cc-save-failed'));
}
function persist(){clearTimeout(persistT);persistT=setTimeout(flush,200);}
window.addEventListener('pagehide',function(){if(persistT){clearTimeout(persistT);flush();}});
document.addEventListener('visibilitychange',function(){if(document.hidden&&persistT){clearTimeout(persistT);flush();}});

async function api(method,url,body){
  await READY;
  var m=url.match(/^\/api\/col\/([a-z]+)(?:\/([^\/?]+))?$/);
  if(!m||COLNAMES.indexOf(m[1])<0)throw fail('invalid_argument');
  var col=m[1],id=m[2]?decodeURIComponent(m[2]):null,st=STORE[col];
  if(!id){
    if(method==='GET')return {docs:Object.keys(st).map(function(k){return {id:k,data:pub(col,st[k])};})};
    if(method==='POST'){
      if(!isObj(body&&body.data))throw fail('invalid_argument');
      if(JSON.stringify(body.data).length>700000)throw fail('quota_exceeded');
      var nid=rid();st[nid]=clean(body.data);persist();return {id:nid,data:pub(col,st[nid])};
    }
    throw fail('invalid_argument');
  }
  if(method==='GET'){var d=st[id];return {exists:!!d,data:d?pub(col,d):null};}
  if(method==='PUT'){
    if(!isObj(body&&body.data))throw fail('invalid_argument');
    if(JSON.stringify(body.data).length>700000)throw fail('quota_exceeded');
    var next=clean(body.data);
    if(col==='config'){delete next.pinHash;delete next.recHash;delete next.hasPin;delete next.hasRecovery;var old=st[id];if(old){if(old.pinHash)next.pinHash=old.pinHash;if(old.recHash)next.recHash=old.recHash;}}
    st[id]=next;persist();return {id:id,data:pub(col,next)};
  }
  if(method==='PATCH'){
    if(!isObj(body&&body.data))throw fail('invalid_argument');
    if(!st[id])throw fail('invalid_argument','not_found');
    var patch=clean(body.data);
    if(col==='config'){delete patch.pinHash;delete patch.recHash;delete patch.hasPin;delete patch.hasRecovery;}
    var nx=deepMerge(st[id],patch);
    if(JSON.stringify(nx).length>700000)throw fail('quota_exceeded');
    st[id]=nx;persist();return {id:id,data:pub(col,nx)};
  }
  if(method==='DELETE'){
    if(col==='config')throw fail('invalid_argument');
    delete st[id];persist();return null;
  }
  throw fail('invalid_argument');
}

/* ---- parent PIN, recovery code, backup (all on this device) ---- */
var enc=new TextEncoder();
function hex(buf){return Array.prototype.map.call(new Uint8Array(buf),function(b){return b.toString(16).padStart(2,'0');}).join('');}
async function derive(secret,salt){
  if(window.crypto&&crypto.subtle){
    var key=await crypto.subtle.importKey('raw',enc.encode(String(secret)),'PBKDF2',false,['deriveBits']);
    var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256);
    return hex(bits);
  }
  var h=5381,t=salt+'|'+secret;for(var i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return 'x'+h.toString(16);
}
async function mkHash(v){var salt=rid();return 'pb$'+salt+'$'+await derive(v,salt);}
async function chkHash(v,stored){
  if(!stored)return false;var p=String(stored).split('$');if(p.length!==3)return false;
  return (await derive(String(v),p[1]))===p[2];
}
var CODE_ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){
  var a=new Uint8Array(8);
  try{crypto.getRandomValues(a);}catch(e){for(var i=0;i<8;i++)a[i]=Math.floor(Math.random()*256);}
  var s='';for(var j=0;j<8;j++)s+=CODE_ABC[a[j]%CODE_ABC.length];
  return s.slice(0,4)+'-'+s.slice(4);
}
function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function getFails(){try{return JSON.parse(localStorage.getItem('cc_fails')||'{}')||{};}catch(e){return {};}}
function setFails(f){try{localStorage.setItem('cc_fails',JSON.stringify(f));}catch(e){}}
function isLocked(){var f=getFails();return !!(f.until&&Date.now()<f.until);}
function noteFail(){var f=getFails();f.n=(f.n||0)+1;if(f.n>=5){f.n=0;f.until=Date.now()+30000;}setFails(f);}
function clearFails(){setFails({});}
function setCfg(patch){
  STORE.config.main=Object.assign({},STORE.config.main||{},patch);persist();
  applyLocal('config','main',pub('config',STORE.config.main));
}
async function pinCall(kind,b){
  await READY;b=b||{};
  var cfg=STORE.config.main||{},stored=cfg.pinHash,ok4=/^\d{4}$/;
  function res(status,o){return Object.assign({status:status},o);}
  function lockErr(){var e=new Error('locked');e.locked=true;return e;}
  if(kind==='verify'){
    if(isLocked())throw lockErr();
    if(!ok4.test(b.pin))return res(400,{error:'bad_pin'});
    if(!stored)return res(200,{ok:false,needsSetup:true});
    if(await chkHash(b.pin,stored)){clearFails();return res(200,{ok:true});}
    noteFail();return res(403,{ok:false});
  }
  if(kind==='set'){
    if(!ok4.test(b.pin))return res(400,{error:'bad_pin'});
    if(stored){
      if(isLocked())throw lockErr();
      if(!ok4.test(b.current||'')||!(await chkHash(b.current,stored))){noteFail();return res(403,{ok:false});}
      clearFails();
    }
    var patch={pinHash:await mkHash(b.pin)},code=null;
    if(!cfg.recHash){code=newCode();patch.recHash=await mkHash(normCode(code));}
    setCfg(patch);return res(200,{ok:true,recovery:code});
  }
  if(kind==='checkcode'||kind==='reset'){
    if(isLocked())throw lockErr();
    if(!cfg.recHash||!(await chkHash(normCode(b.code),cfg.recHash))){noteFail();return res(403,{ok:false});}
    clearFails();
    if(kind==='checkcode')return res(200,{ok:true});
    if(!ok4.test(b.pin))return res(400,{error:'bad_pin'});
    var code2=newCode();
    setCfg({pinHash:await mkHash(b.pin),recHash:await mkHash(normCode(code2))});
    return res(200,{ok:true,recovery:code2});
  }
  if(kind==='newcode'){
    if(isLocked())throw lockErr();
    if(!stored||!(await chkHash(b.current||'',stored))){noteFail();return res(403,{ok:false});}
    clearFails();
    var code3=newCode();setCfg({recHash:await mkHash(normCode(code3))});
    return res(200,{ok:true,recovery:code3});
  }
  return res(404,{error:'not_found'});
}
async function backupObj(){await READY;flush();return {app:'chore-chart',version:1,saved:new Date().toISOString(),store:STORE};}
async function restoreObj(o){
  await READY;
  if(!isObj(o)||o.app!=='chore-chart'||!isObj(o.store))throw fail('invalid_argument','That file is not a chore chart backup.');
  var next={};
  COLNAMES.forEach(function(c){next[c]=isObj(o.store[c])?clean(o.store[c]):{};});
  STORE=next;flush();
  if(idb){try{await idbPut(STORE);}catch(e){lsSave();}}
}
async function wipeAll(){
  await READY;
  STORE={};COLNAMES.forEach(function(c){STORE[c]={};});
  if(idb){try{await idbPut(STORE);}catch(e){}}
  try{localStorage.removeItem(LS_KEY);localStorage.removeItem('cc_fails');}catch(e){}
}
window.CCLOCAL={pin:pinCall,backup:backupObj,restore:restoreObj,wipe:wipeAll};
function docSnap(id,data){return {id:id,exists:data!==undefined,data:function(){return data;},metadata:META};}
function load(col){
  var c=C(col);
  if(c.loaded)return Promise.resolve();
  if(c.loading)return c.loading;
  c.loading=api('GET','/api/col/'+col).then(function(j){
    c.map=new Map(j.docs.map(function(d){return [d.id,d.data];}));
    c.loaded=true;c.loading=null;
  },function(e){c.loading=null;throw e;});
  return c.loading;
}
function notify(col){
  C(col).subs.forEach(function(s){s.fn();});
  Object.keys(docSubs).forEach(function(k){if(k.indexOf(col+'/')===0)docSubs[k].forEach(function(s){s.fn();});});
}
function applyLocal(col,id,data){
  var c=C(col);if(!c.loaded)return;
  if(data==null)c.map.delete(id);else c.map.set(id,data);
  notify(col);
}
function cmp(a,b){return a<b?-1:a>b?1:0;}
function matches(d,f){
  var v=d[f[0]],op=f[1],x=f[2];
  switch(op){
    case '==':return v===x;
    case '!=':return v!==x;
    case '<':return v<x;
    case '<=':return v<=x;
    case '>':return v>x;
    case '>=':return v>=x;
    case 'in':return Array.isArray(x)&&x.indexOf(v)>=0;
    case 'not-in':return Array.isArray(x)&&x.indexOf(v)<0;
    case 'array-contains':return Array.isArray(v)&&v.indexOf(x)>=0;
  }
  return true;
}
function build(col,spec){
  var rows=[];
  C(col).map.forEach(function(data,id){rows.push({id:id,data:data});});
  spec.filters.forEach(function(f){rows=rows.filter(function(r){return matches(r.data,f);});});
  if(spec.order){
    var f=spec.order[0],dir=spec.order[1]==='desc'?-1:1;
    rows.sort(function(a,b){
      var x=a.data[f],y=b.data[f];
      if(x===undefined&&y===undefined)return 0;
      if(x===undefined)return 1;
      if(y===undefined)return -1;
      return dir*cmp(x,y);
    });
  }else rows.sort(function(a,b){return cmp(a.id,b.id);});
  if(spec.lim)rows=rows.slice(0,spec.lim);
  var docs=rows.map(function(r){return docSnap(r.id,r.data);});
  return {docs:docs,size:docs.length,empty:!docs.length,docChanges:function(){return [];},metadata:META};
}
function makeQuery(col,spec){
  return {
    where:function(f,op,v){return makeQuery(col,{filters:spec.filters.concat([[f,op,v]]),order:spec.order,lim:spec.lim});},
    orderBy:function(f,dir){return makeQuery(col,{filters:spec.filters,order:[f,dir||'asc'],lim:spec.lim});},
    limit:function(n){return makeQuery(col,{filters:spec.filters,order:spec.order,lim:n});},
    get:async function(){await load(col);return build(col,spec);},
    onSnapshot:function(next,error){
      var sub={dead:false,fn:function(){if(sub.dead)return;try{next(build(col,spec));}catch(e){console.error(e);}}};
      C(col).subs.add(sub);
      var attempt=function(){
        if(sub.dead)return;
        load(col).then(function(){sub.fn();},function(e){
          if(sub.dead)return;
          if(error)error(e);
          setTimeout(attempt,3000);
        });
      };
      attempt();
      return function(){sub.dead=true;C(col).subs.delete(sub);};
    }
  };
}
function docRef(col,id){
  var url='/api/col/'+col+'/'+encodeURIComponent(id);
  return {
    id:id,path:col+'/'+id,
    get:async function(){var j=await api('GET',url);return docSnap(id,j.exists?j.data:undefined);},
    set:async function(data){var j=await api('PUT',url,{data:data});applyLocal(col,id,j.data);},
    update:async function(data){var j=await api('PATCH',url,{data:data});applyLocal(col,id,j.data);},
    delete:async function(){await api('DELETE',url);applyLocal(col,id,null);},
    onSnapshot:function(next,error){
      var key=col+'/'+id;
      var sub={dead:false,fn:function(){if(sub.dead)return;try{next(docSnap(id,C(col).map.get(id)));}catch(e){console.error(e);}}};
      (docSubs[key]||(docSubs[key]=new Set())).add(sub);
      var attempt=function(){
        if(sub.dead)return;
        load(col).then(function(){sub.fn();},function(e){
          if(sub.dead)return;
          if(error)error(e);
          setTimeout(attempt,3000);
        });
      };
      attempt();
      return function(){sub.dead=true;docSubs[key].delete(sub);};
    }
  };
}
function collection(name){
  var q=makeQuery(name,{filters:[],order:null,lim:null});
  q.path=name;
  q.doc=function(id){return docRef(name,id||rid());};
  q.add=async function(data){var j=await api('POST','/api/col/'+name,{data:data});applyLocal(name,j.id,j.data);return docRef(name,j.id);};
  return q;
}
var DB={
  collection:collection,
  doc:function(path){var p=String(path).split('/');return docRef(p[0],p[1]);}
};

function connect(){}
var USER={can:function(){return true;},canEdit:function(){return true;},isOwner:function(){return true;}};
window.claude={use:async function(name){
  if(name==='db'){await READY;connect();return DB;}
  if(name==='user')return USER;
  return null;
}};
})();

function weekStats(kid,mon,now){
  const today=dstr(now),first=firstDate();const days=[];let cnt=0,total=0,pts=0,perfect=0;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);const ds=dstr(d);
    let st='ok',c=0,t=0;
    if(ds>today)st='future';
    else if(ds<first)st='before';
    else{
      const e=effDay(kid,ds);
      if(ds===today){const cs=choresFor(kid,d);t=cs.length;c=cs.filter(x=>e.done[x.id]>0).length;}
      else if(S.days[ds+'_'+kid]){t=S.days[ds+'_'+kid].total||0;c=Object.values(e.done).filter(v=>v>0).length;if(!t)t=c;}
      else{t=choresFor(kid,d).length;c=0;}
      c=Math.min(c,t);if(t===0)st='none';
      pts+=sumDay(e);
      if(st==='ok'){cnt+=c;total+=t;if(c>=t)perfect++;}
    }
    days.push({ds,d,st,c,t,pct:t?Math.round(c/t*100):null});

/* A past day is judged by what was on the chart that day (the chore count saved with it), so adding a chore later never breaks an old streak. */
function pastDayState(kid,ds){
  const doc=S.days[ds+'_'+kid];if(!doc)return null;
  const t=Number(doc.total)||0;if(!t)return 'none';
  const e=effDay(kid,ds),xs=e.extras||[];
  const n=Object.keys(e.done).filter(id=>e.done[id]>0&&!xs.includes(id)).length;
  return n>=t?'perfect':'miss';
}
function streakInfo(kid,now){
  const today=dstr(now),floor=lastStreakAward(kid);
  let n=0,start='';const d=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  for(let i=0;i<400&&n<STREAK_GOAL+5;i++){
    const ds=dstr(d);
    if(floor&&ds<=floor)break;
    const ps=ds!==today?pastDayState(kid,ds):null;
    if(ps==='perfect'){n++;start=ds;}
    else if(ps==='miss')break;
    else if(ps!=='none'){
      const cs=choresFor(kid,d);
      if(cs.length){
        const e=effDay(kid,ds);
        if(cs.every(c=>e.done[c.id]>0)){n++;start=ds;}
        else if(ds!==today)break;
      }
    }
    d.setDate(d.getDate()-1);
  }
  return {n,start};
}

async function poolAdd(kid,rid,amtRaw){
  if(busyRedeem||!db)return;
  if(!canWrite){toast('View only on this device.');return;}

  const cost=Number(r.cost)||0,pl=poolOf(rid),tot=poolSum(pl),left=Math.max(0,cost-tot);
  const amt=amtRaw==='max'?Math.min(balance(kid),left):Math.min(Number(amtRaw)||0,balance(kid),left);
  if(amt<1){toast('Not enough points to add.');return;}
  busyRedeem=true;
  const done=tot+amt>=cost,t=Date.now();
  const ok=await safe(async()=>{
    await db.collection('adjustments').doc('pool-'+kid+'-'+t.toString(36)).set({kid,points:-amt,note:'Shared: '+r.name,sharedFor:rid,ts:t,used:done});
    if(done){
      for(const a of pl)await db.collection('adjustments').doc(a.id).update({used:true});
      await db.collection('redemptions').add({kid,rewardId:rid,name:r.name,cost:0,shared:true,ts:t,date:todayStr(),status:'pending'});

}

async function cuApply(){

  if(!canWrite){toast('View only on this device.');return;}
  const date=CU.date,dd=cuDate(date);let total=0,bonusKids=[];
  const ok=await safe(async()=>{

      const sel=CU.sel[k.id];if(!sel||!sel.size)continue;
      const list=choresFor(k.id,dd),ed=effDay(k.id,date),done={};
      list.forEach(c=>{if(sel.has(c.id)&&!(ed.done[c.id]>0)){done[c.id]=Math.max(1,Number(c.points)||1);total++;}});
      if(!Object.keys(done).length)continue;
      const all=list.length>0&&list.every(c=>ed.done[c.id]>0||done[c.id]>0);
      const bonus=all?(ed.bonus>0?ed.bonus:bonusPts()):ed.bonus;
      if(all&&!(ed.bonus>0))bonusKids.push(k.name);
      await writeDay(k.id,date,{kid:k.id,date,done,total:list.length,bonus});
    }
  },null);

  $('#pin').innerHTML='<div class="pin-panel" role="dialog" aria-modal="true" aria-label="'+title+'"><h2>'+title+'</h2><p class="muted">'+sub+'</p><div class="dots" aria-hidden="true">'+dots+'</div><p class="pin-msg" role="alert">'+esc(pinS.msg)+'</p><div class="pad">'+keys+'<button class="key plain" data-act="pin-cancel">Cancel</button><button class="key" data-act="pin-d" data-d="0" aria-label="0">0</button><button class="key plain" data-act="pin-back" aria-label="Delete last digit">Delete</button></div>'+(m==='enter'&&S.cfg.hasRecovery?'<button type="button" class="linkbtn" data-act="pin-forgot">Forgot your PIN?</button>':'')+'</div>';

function shake(){const p=$('.pin-panel');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');}}
function pinDigit(d){
  if(pinS.busy||pinS.mode==='loading')return;
  if(pinS.mode==='enter'&&Date.now()<pinS.until){pinS.msg='Too many tries. Wait a moment.';renderPin();return;}
  if(pinS.buf.length>=4)return;

}
async function pinSubmit(){
  if(pinS.busy)return;pinS.busy=true;const buf=pinS.buf;
  try{
    if(pinS.mode==='enter'){
      let r;
      try{r=await pinApi('verify',{pin:buf});}
      catch(e){pinS.buf='';pinS.msg=e.locked?'Too many tries. Wait 30 seconds.':'Something went wrong. Try again.';renderPin();shake();return;}
      if(r.ok){curPin=buf;afterUnlock(pinS.purpose);}
      else{pinS.buf='';pinS.msg='That PIN is not right.';renderPin();shake();}
    }else if(pinS.mode==='new'){
      pinS.first=buf;pinS.buf='';pinS.mode='confirm';pinS.msg='';renderPin();
    }else if(pinS.mode==='confirm'){
      if(buf!==pinS.first){pinS.buf='';pinS.first='';pinS.mode='new';pinS.msg='Those did not match. Start again.';renderPin();shake();}
      else{
        const p=pinS.purpose;
        let rec=null;
        const ok=await safe(async()=>{const r=p==='reset'?await pinApi('reset',{pin:buf,code:pinS.rc}):await pinApi('set',{pin:buf,current:curPin||undefined});if(!r.ok)throw new Error('pin');rec=r.recovery||null;},p==='change'?'PIN changed':'');
        if(ok){
          curPin=buf;
          const go=()=>{if(p==='change')closePin();else afterUnlock(p==='reset'?'unlock':p);};
          if(rec){closePin();showRecovery(rec,go);}else go();
        }else{pinS.buf='';renderPin();}
      }
    }
  }finally{pinS.busy=false;}
}

  }else if(celebrate)celebrateKid(kid,bonus);

  }).then(()=>{

function startConfetti(kid){
  const cv=$('#confetti');if(!cv||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))return;
  const ctx=cv.getContext('2d'),dpr=Math.min(2,window.devicePixelRatio||1);
  const W=cv.width=Math.floor(innerWidth*dpr),H=cv.height=Math.floor(innerHeight*dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=['--'+kid,'--gold','--blue1','--warm1','--grape','--done'].map(v=>cs.getPropertyValue(v).trim()||'#F2B01E');
  const bits=[];
  const spawn=n=>{for(let i=0;i<n;i++)bits.push({x:Math.random()*W,y:-20*dpr-Math.random()*H*.3,vx:(Math.random()-.5)*4*dpr,vy:(2+Math.random()*4)*dpr,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:(8+Math.random()*10)*dpr,c:cols[(Math.random()*cols.length)|0],round:Math.random()<.3});};
  spawn(120);const t0=performance.now();let second=false;
  const step=t=>{
    const el=t-t0;if(!second&&el>1200){second=true;spawn(80);}
    ctx.clearRect(0,0,W,H);let alive=0;
    for(const p of bits){p.vy+=.07*dpr;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      if(p.y<H+40){alive++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;
        if(p.round){ctx.beginPath();ctx.arc(0,0,p.s/2,0,6.283);ctx.fill();}else ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}}

  const lim={points:[1,50],cost:[5,2000],target:[5,2000],d:[1,Math.max(1,E.max||1)]}[f];if(!lim)return;
  E[f]=clamp(E[f]+d,lim[0],lim[1]);
  const out=$('#out-'+f);if(out)out.textContent=(f==='target'||f==='d')?'$'+E[f]:E[f];
  const cc=$('#cv-cost');if(cc&&E.kind==='convert')cc.textContent='Costs '+(E.d*rate())+' points';
}

document.addEventListener('click',e=>{
  if(e.target.closest&&e.target.closest('#celebrate')){closeCel();return;}
  const el=e.target.closest('[data-act]');
  if(!el){
    const t=e.target;
    if(t.id==='sheet')closeSheet();else if(t.id==='editor')closeEditor();else if(t.id==='pin')closePin();else if(t.id==='chat')closeChat();
    return;
  }
  if(parentUnlocked)resetIdle();
  const a=el.dataset.act;
  switch(a){
    case 'toggle':toggle(el.dataset.kid,el.dataset.chore,e);break;
    case 'toggle-extra':toggleExtra(el.dataset.kid,el.dataset.chore,e);break;
    case 'rm-extra':rmExtra(el.dataset.kid,el.dataset.chore);break;
    case 'mtab':mainTab=el.dataset.tab;renderMain();break;
    case 'open-sheet':openSheet(el.dataset.kid);break;
    case 'close-sheet':closeSheet();break;
    case 'stab':sheetTab=el.dataset.tab;confirmId=null;renderSheet();break;
    case 'pool-add':poolAdd(el.dataset.kid,el.dataset.id,el.dataset.amt);break;
    case 'rw-fold':{const g=el.dataset.g;lsSet('cc_fold_rw_'+g,lsGet('cc_fold_rw_'+g,'0')==='1'?'0':'1');render();break;}
    case 'redeem':confirmId=el.dataset.id;renderSheet();break;
    case 'redeem-no':confirmId=null;renderSheet();break;
    case 'redeem-yes':redeem(el.dataset.id);break;
    case 'buy-ask':confirmId=el.dataset.id;renderSheet();break;
    case 'buy-yes':buyItem(sheetKid,el.dataset.id);break;
    case 'idea-add':openEditor('idea');break;
    case 'goal-add':openEditor('goal');break;
    case 'goal-open':openEditor('gmove',el.dataset.id);break;
    case 'goal-edit':openEditor('goal',el.dataset.id);break;
    case 'gm-mode':if(E&&E.kind==='gmove'){E.mode=el.dataset.mode;E.max=moveMax();E.d=E.max>0?1:0;drawEditor();}break;
    case 'goal-ask':if(E&&E.kind==='gmove'){const id=E.id;safe(()=>db.collection('goals').doc(id).update({status:'requested'}),'Sent to a parent!').then(ok=>{if(ok)closeEditor();});}break;
    case 'cash-open':openEditor('convert');break;
    case 'photo':{photoKid=sheetKid;const f=$('#photo-in');if(f){f.value='';f.click();}break;}
    case 'photo-reset':{const kid=sheetKid;if(kid)safe(()=>saveProfile(kid,{img:null,emoji:null}),'Back to the original photo');break;}
    case 'photo-for':{const id=el.dataset.id;if(!SND[id]||SND[id].kid)break;photoKid=id;const f=$('#photo-in');if(f){f.value='';f.click();}break;}
    case 'photo-reset-for':{const id=el.dataset.id;if(SND[id]&&!SND[id].kid)safe(()=>saveProfile(id,{img:null}),'Photo removed');break;}
    case 'cust-toggle':custOpen=!custOpen;photoOpen=false;renderSheet();break;
    case 'photo-toggle':photoOpen=!photoOpen;custOpen=false;renderSheet();break;
    case 'pick-emoji':{const kid=sheetKid,e=el.dataset.e;if(kid&&EMO[e])safe(()=>saveProfile(kid,{emoji:e,img:null}));break;}
    case 'pick-color':{const kid=sheetKid,f=el.dataset.field,c=el.dataset.c;if(kid&&((PALM[c]&&(f==='bg'||f==='theme'))||(SBGM[c]&&f==='sbg')))safe(()=>saveProfile(kid,{[f]:c}));break;}
    case 'tx-toggle':txOpen=!txOpen;renderSheet();break;
    case 'rwtx-toggle':rwTxOpen=!rwTxOpen;renderSheet();break;
    case 'sound':lsSet('cc_mute',muted()?'0':'1');renderMain();if(!muted())sfxCheck();break;
    case 'chat':openChat();break;
    case 'chat-close':closeChat();break;
    case 'chat-as':{const id=el.dataset.id,s=SND[id];if(!s)break;
      if(s.kid||parentUnlocked){chat.as=id;lsSet('cc_chat_as',id);renderChat();}
      else{chat.pendingAs=id;openPin('chat');}
      break;}
    case 'chat-clear':if(!clearArmed){clearArmed=true;renderParent();setTimeout(()=>{clearArmed=false;if(!$('#parent').hidden)renderParent();},3500);}else{clearArmed=false;const ids=S.msgs.map(m=>m.id);safe(()=>Promise.all(ids.map(id=>db.collection('messages').doc(id).delete())),'Chat cleared').then(()=>renderParent());}break;
    case 'parents':if(parentUnlocked)openParent();else openPin('unlock');break;
    case 'lock':lockParent();break;
    case 'ptab':ptab=el.dataset.tab;renderParent();break;
    case 'add-chore':openEditor('chore',null);break;
    case 'open-box':openBox(el.dataset.kid);break;
    case 'box-add':{const t=Number(el.dataset.tier),inp=$('#bx-'+t),name=(inp&&inp.value||'').trim();if(!name){toast('Type a prize first.');break;}safe(()=>db.collection('rewards').add({name,icon:guessIcon(name),box:t,kid:'',cost:0}),'Prize added');break;}
    case 'box-del':safe(()=>db.collection('rewards').doc(el.dataset.id).delete(),'Prize removed');break;
    case 'box-given':safe(()=>db.collection('adjustments').doc(el.dataset.id).update({given:true,givenTs:Date.now()}),'Marked as given');break;
    case 'oo-step':{const n=$('#oo-name');if(n)OO.name=n.value;OO.pts=clamp(OO.pts+Number(el.dataset.d),1,100);renderParent();break;}
    case 'oo-kid':{const n=$('#oo-name');if(n)OO.name=n.value;const k=el.dataset.kid;OO.kids.has(k)?OO.kids.delete(k):OO.kids.add(k);renderParent();break;}
    case 'oo-add':{const name=($('#oo-name').value||'').trim(),pts=OO.pts;if(!name){toast('Type the chore first.');break;}if(!OO.kids.size){toast('Pick who it is for.');break;}
      const date=dstr(new Date()),icon=guessIcon(name),ks=[...OO.kids];
      safe(()=>{ks.forEach(k=>{const ed=effDay(k,date);if(ed.bonus>0)db.collection('days').doc(date+'_'+k).update({bonus:0}).catch(()=>{});});return db.collection('chores').doc('oo-'+date+'-'+Date.now().toString(36)).set({name,points:pts,icon,kids:ks,days:[],oneoff:true,date,order:900});},'Chore assigned for today').then(ok=>{if(ok){OO.name='';OO.pts=5;OO.kids=new Set();renderParent();}});break;}
    case 'oo-del':safe(()=>db.collection('chores').doc(el.dataset.id).delete(),'Removed');break;
    case 'add-xchore':openEditor('chore',null,true);break;
    case 'xc-suggest':suggestExtras();break;
    case 'edit-chore':openEditor('chore',el.dataset.id);break;
    case 'add-reward':openEditor('reward',null);break;
    case 'edit-reward':openEditor('reward',el.dataset.id);break;
    case 'e-cancel':closeEditor();break;
    case 'e-del':deleteEditor();break;
    case 'e-step':eStep(el);break;
    case 'e-icon':{if(!E)break;E.icon=el.dataset.i;E.touched=true;document.querySelectorAll('[data-act="e-icon"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.i===E.icon));break;}
    case 'e-color':{if(!E)break;E.color=Number(el.dataset.i);document.querySelectorAll('[data-act="e-color"]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.i)===E.color));break;}
    case 'e-kid':{if(!E)break;const id=el.dataset.kid;if(E.kids.has(id))E.kids.delete(id);else E.kids.add(id);el.setAttribute('aria-pressed',E.kids.has(id));break;}
    case 'e-day':{if(!E)break;const d=Number(el.dataset.d);if(E.days.has(d))E.days.delete(d);else E.days.add(d);el.setAttribute('aria-pressed',E.days.has(d));break;}
    case 'e-rkid':{if(!E)break;E.kid=el.dataset.kid;document.querySelectorAll('[data-act="e-rkid"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.kid===E.kid));drawEditor();break;}
    case 'given':safe(()=>db.collection('redemptions').doc(el.dataset.id).update({status:'given',givenTs:Date.now()}),'Marked as given');break;
    case 'refund':safe(()=>db.collection('redemptions').doc(el.dataset.id).delete(),'Points refunded');break;
    case 'idea-step':{const id=el.dataset.id;ideaCost[id]=clamp((ideaCost[id]||50)+Number(el.dataset.d),5,2000);renderParent();break;}
    case 'idea-yes':approveIdea(el.dataset.id);break;
    case 'idea-no':safe(()=>db.collection('ideas').doc(el.dataset.id).update({status:'declined'}),'Declined');break;
    case 'goal-bought':safe(()=>db.collection('goals').doc(el.dataset.id).update({status:'bought',boughtTs:Date.now()}),'Marked as bought');break;
    case 'goal-notyet':safe(()=>db.collection('goals').doc(el.dataset.id).update({status:'saving'}),'Sent back to saving');break;
    case 'adj-mode':adjF.mode=el.dataset.mode;renderParent();break;
    case 'adj-kid':adjF.kid=el.dataset.kid;renderParent();break;
    case 'adj-step':{const d=Number(el.dataset.d);
      if(adjF.mode==='money'){adjF.mAmt=clamp(adjF.mAmt+d,-500,500);if(adjF.mAmt===0)adjF.mAmt=d;}
      else{adjF.pAmt=clamp(adjF.pAmt+d*5,-500,500);if(adjF.pAmt===0)adjF.pAmt=d*5;}
      renderParent();break;}
    case 'adj-apply':{const note=(adjF.note||'').trim(),kid=adjF.kid,isM=adjF.mode==='money',amt=isM?adjF.mAmt:adjF.pAmt;
      safe(()=>isM?db.collection('money').add({kid,type:'adjust',cents:amt*100,note,ts:Date.now()}):db.collection('adjustments').add({kid,points:amt,note,ts:Date.now()}),isM?'Money updated':'Points updated').then(ok=>{if(ok){adjF.note='';renderParent();}});break;}
    case 'adj-del':safe(()=>db.collection('adjustments').doc(el.dataset.id).delete(),'Removed');break;
    case 'money-del':safe(()=>db.collection('money').doc(el.dataset.id).delete(),'Removed');break;
    case 'bonus-step':{const cur=setF.bonus==null?bonusPts():setF.bonus;setF.bonus=clamp(cur+Number(el.dataset.d),0,100);renderParent();break;}
    case 'bonus-save':{const b=setF.bonus;if(b==null)break;safe(()=>saveCfg({bonus:b}),'Bonus saved').then(ok=>{if(ok){setF.bonus=null;renderParent();}});break;}
    case 'streak-step':{const cur=setF.streak==null?streakPts():setF.streak;setF.streak=clamp(cur+Number(el.dataset.d),0,5000);renderParent();break;}
    case 'games-once':safe(()=>saveCfg({gameOnce:!oncePerDay()}),oncePerDay()?'Kids can play as often as they like':'One play a day');break;
    case 'games-again':safe(()=>saveCfg({['played_'+el.dataset.kid]:'',['gl_'+el.dataset.kid]:''}),'They can play again today');break;
    case 'games-master':safe(()=>saveCfg({gamesOn:!gamesOn()}),gamesOn()?'Games turned off':'Games turned on');break;
    case 'game-fold':{const g=el.dataset.g;lsSet('cc_fold_game_'+g,lsGet('cc_fold_game_'+g,'0')==='1'?'0':'1');renderParent();break;}
    case 'game-step':{const f=el.dataset.f,g=gameForm(),d=Number(el.dataset.d),lim={mins:[1,60],extra:[1,30],cost:[1,100]}[f];setF.gm=Object.assign({},setF.gm||{},{[f]:clamp(g[f]+d,lim[0],lim[1])});renderParent();break;}
    case 'game-grant':{const kid=el.dataset.kid,gid=el.dataset.g,gid2='grant-'+kid+'-'+gid;if(S.adjs.some(a=>a.id===gid2))safe(()=>db.collection('adjustments').doc(gid2).delete(),'Game locked');else if(hasGame(kid,gid))toast('This kid won it from a prize box.');else{const gm=GAMES.find(x=>x.id===gid);safe(()=>db.collection('adjustments').doc(gid2).set({kid,points:0,game:gid,opened:true,given:true,prize:gm.name,icon:'🎮',ts:Date.now(),note:'Game unlocked by a parent'}),'Game unlocked');}break;}
    case 'ar-step':{const key=el.dataset.key,d=Number(el.dataset.d),mn=Number(el.dataset.min),mx=Number(el.dataset.max),cur=gnum(key,key==='ptMins'?10:0);safe(()=>saveCfg({[key]:clamp(cur+d,mn,mx)}));break;}
    case 'ar-tier':safe(()=>saveCfg({['gb_'+el.dataset.kid+'_'+el.dataset.g]:Number(el.dataset.v)}));break;
    case 'ar-ptkid':{const k='ptOn_'+el.dataset.kid;safe(()=>saveCfg({[k]:S.cfg[k]===false}));break;}
    case 'game-save':{if(!setF.gm)break;const g=gameForm();safe(()=>saveCfg({gameMins:g.mins,gameExtraMins:g.extra,gameExtraCost:g.cost}),'Play time saved').then(ok=>{if(ok){setF.gm=null;renderParent();}});break;}
    case 'streak-save':{const v=setF.streak;if(v==null)break;safe(()=>saveCfg({streakPts:v}),'Streak award saved').then(ok=>{if(ok){setF.streak=null;renderParent();}});break;}
    case 'rate-step':{const cur=setF.rate==null?rate():setF.rate;setF.rate=clamp(cur+Number(el.dataset.d),1,200);renderParent();break;}
    case 'rate-save':{const r=setF.rate;if(r==null)break;safe(()=>saveCfg({rate:r}),'Rate saved').then(ok=>{if(ok){setF.rate=null;renderParent();}});break;}
    case 'change-pin':openPin('change');break;
    case 'pin-d':pinDigit(el.dataset.d);break;
    case 'pin-back':pinS.buf=pinS.buf.slice(0,-1);renderPin();break;
    case 'pin-cancel':closePin();break;
    case 'pin-forgot':pinS.mode='recovery';pinS.msg='';renderPin();setTimeout(()=>{const i=$('#pin-rc');if(i)i.focus();},50);break;
    case 'pin-rc-back':pinS.mode='enter';pinS.msg='';pinS.buf='';renderPin();break;
    case 'pin-rc-go':{const code=($('#pin-rc')||{}).value||'';pinApi('checkcode',{code}).then(r=>{if(r.ok){pinS.rc=code;pinS.purpose='reset';pinS.mode='new';pinS.buf='';pinS.first='';pinS.msg='';renderPin();}else{pinS.msg='That code is not right.';renderPin();shake();}}).catch(e=>{pinS.msg=e&&e.locked?'Too many tries. Wait 30 seconds.':'Something went wrong.';renderPin();});break;}
    case 'su-open':openSetup('edit');break;
    case 'inst-hide':lsSet('cc_inst','1');render();break;
    case 'su-cancel':closeSetup();break;
    case 'su-add':SU.kids.push({id:'',name:'',born:'',pal:PAL_ORDER[SU.kids.length%PAL_ORDER.length]});drawSetup();break;
    case 'su-del':{const i=Number(el.dataset.i);if(SU.armed===i){SU.kids.splice(i,1);SU.armed=-1;}else SU.armed=i;drawSetup();break;}
    case 'su-pal':SU.kids[Number(el.dataset.i)].pal=el.dataset.p;drawSetup();break;
    case 'rc-done':{$('#recov').hidden=true;syncLock();const f=showRecovery.then;showRecovery.then=null;if(f)f();break;}
    case 'rc-new':{if(!curPin){toast('Unlock the parent portal first.');break;}pinApi('newcode',{current:curPin}).then(r=>{if(r.ok)showRecovery(r.recovery,()=>{});else toast('Could not make a new code.');});break;}
    case 'bk-save':saveBackup();break;
    case 'bk-restore':{const f=$('#bk-in');if(f){f.value='';f.click();}break;}
    case 'wipe-all':{if(!confirm('Erase every chore, point, reward and photo on this iPad and start over? This cannot be undone. Save a backup first if you might want anything back.'))break;window.CCLOCAL.wipe().then(()=>location.reload());break;}
    case 'play-game':arcadeStart(el.dataset.kid,el.dataset.game);break;
    case 'play-daily':dailyStart(el.dataset.kid,el.dataset.kind);break;
    case 'close-cel':closeCel();break;
  }
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='suf')saveSetup();else if(e.target.id==='ef')saveEditor();else if(e.target.id==='cf')sendChat();});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='adj-note')adjF.note=e.target.value;});
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.su&&SU.kids[Number(t.dataset.i)]){SU.kids[Number(t.dataset.i)][t.dataset.su]=t.value;SU.err='';}if(t&&t.id==='su-starter')SU.starter=t.checked;});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='photo-in')handlePhoto(e.target);if(e.target&&e.target.id==='bk-in')restoreBackup(e.target);if(e.target&&e.target.id==='su-starter')SU.starter=e.target.checked;if(e.target&&e.target.id==='cu-date'&&e.target.value){CU.date=e.target.value;CU.sel={};renderParent();}if(e.target&&e.target.dataset&&e.target.dataset.act==='pick-extra')pickExtra(e.target.dataset.kid,e.target.value);});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#celebrate').hidden)closeCel();else if(!$('#recov').hidden){}else if(!$('#setup').hidden&&SU.mode==='edit')closeSetup();else if(!$('#pin').hidden)closePin();else if(!$('#chat').hidden)closeChat();else if(!$('#editor').hidden)closeEditor();else if(!$('#sheet').hidden)closeSheet();
});

/* ---------- daily rollover ---------- */
let curDate=todayStr();
setInterval(()=>{const t=todayStr();if(t!==curDate){curDate=t;render();}},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){curDate=todayStr();render();}});

window.addEventListener('cc-save-failed',()=>toast('This browser could not save your data. Is private browsing on?'));
/* ---------- start ---------- */
async function init(){
  render();
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null;}catch(e){db=null;}
  if(!db){S.noDb=true;render();return;}
  try{
    const u=window.claude.use?await window.claude.use('user'):null;
    if(u&&typeof u.can==='function'){const w=await Promise.resolve(u.can('data.write'));if(w===false)canWrite=false;}
  }catch(e){}
  const onErr=err=>{S.err=(err&&err.code)||'error';schedule();};
  const sub=(key,q,fn)=>q.onSnapshot(snap=>{fn(snap);got[key]=true;S.err='';schedule();},onErr);
  const rows=snap=>snap.docs.map(d=>Object.assign({id:d.id},d.data()));
  sub('chores',db.collection('chores'),s=>{S.chores=rows(s);});
  sub('rewards',db.collection('rewards'),s=>{S.rewards=rows(s);});
  sub('days',db.collection('days'),s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data();});S.days=m;});
  sub('reds',db.collection('redemptions'),s=>{S.reds=rows(s);});
  sub('adjs',db.collection('adjustments'),s=>{S.adjs=rows(s);});
  sub('money',db.collection('money'),s=>{S.money=rows(s);});
  sub('goals',db.collection('goals'),s=>{S.goals=rows(s);});
  sub('ideas',db.collection('ideas'),s=>{S.ideas=rows(s);});
  sub('msgs',db.collection('messages').orderBy('ts','desc').limit(150),s=>{S.msgs=rows(s);});
  sub('profiles',db.collection('profiles'),s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data();});S.profiles=m;});
  db.doc('config/main').onSnapshot(snap=>{S.cfg=snap.exists?snap.data():{};applyKids(S.cfg.kids);got.cfg=true;S.err='';schedule();},onErr);
  if(location.hash==='#parents')openPin('unlock');
}
init();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
})();
